# Xcode project definition. Regenerate the .xcodeproj with `xcodegen generate` after editing.
name: Traqula
options:
  bundleIdPrefix: dev.ronit
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: 0.12.0
  # swift-log 1.17 needs Swift 6.3; keep the last release that builds with Xcode 26.1.
  swift-log:
    url: https://github.com/apple/swift-log
    minorVersion: 1.16.0
  MeetingRecords:
    path: Packages/MeetingRecords
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Sign to run locally. Pick your team in Xcode > Signing to keep TCC permissions across rebuilds.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: false
targets:
  Traqula:
    type: application
    platform: macOS
    sources:
      - Traqula
    info:
      path: Traqula/Info.plist
      properties:
        CFBundleDisplayName: Traqula
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSAudioCaptureUsageDescription: Traqula listens to the audio your Mac plays so it can caption and translate meetings.
        NSMicrophoneUsageDescription: Traqula listens to your microphone so your own words appear in the meeting transcript.
    dependencies:
      - package: MeetingRecords
      # The MCP server ships inside the app bundle (Contents/MacOS/traqula-mcp).
      - target: traqula-mcp
        embed: true
        copy:
          destination: executables
  traqula-mcp:
    type: tool
    platform: macOS
    sources:
      - TraqulaMCP
    dependencies:
      - package: MCP
      - package: swift-log
        product: Logging
      - package: MeetingRecords
        product: MeetingRecords
      - package: MeetingRecords
        product: MeetingSummaries
  TraqulaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TraqulaTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Traqula
schemes:
  Traqula:
    build:
      targets:
        Traqula: all
        traqula-mcp: all
        TraqulaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TraqulaTests
